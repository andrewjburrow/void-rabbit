[package]
name = "void-rabbit"
version = "0.5.0"
edition = "2021"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
thiserror = "2"

# Native draw.io parsing, scheduled ICMP checks, and SMTP alerts.
roxmltree = "0.20"
base64 = "0.22"
flate2 = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["process", "time", "sync", "rt", "macros", "io-util", "fs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

rpassword = "7"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
