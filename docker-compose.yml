services:
  itam:
    build: .
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "0.0.0.0:${ITAM_PORT:-8080}:8080"
    environment:
      ITAM_BIND: "0.0.0.0:8080"
      ITAM_DB_PATH: "/data/itam.sqlite"
      TOPOLOGY_SECURE_COOKIE: "${TOPOLOGY_SECURE_COOKIE:-false}"
    volumes:
      - topology-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  topology-data:
